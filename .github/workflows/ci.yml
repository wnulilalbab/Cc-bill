name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check and build (production config)
        run: npm run build

      - name: Tests (fixtures and harness)
        run: npm test

      - name: Build (staging config)
        env:
          VITE_APP_ENV: staging
          VITE_BASE: /Cc-bill/staging/
        run: npm run build
