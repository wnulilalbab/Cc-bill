name: Deploy to staging

# Every merge to main goes to staging only. Production changes only via the Release workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (staging)
        env:
          VITE_APP_ENV: staging
          VITE_BASE: /Cc-bill/staging/
          VITE_APP_VERSION: staging-${{ github.sha }}
        run: |
          npm run build
          printf '{"env":"staging","sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/build.json

      - name: Publish to gh-pages/staging
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: staging
          keep_files: false
          commit_message: "staging: ${{ github.sha }}"
